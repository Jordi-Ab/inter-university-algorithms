[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inter-university-algorithms"
version = "0.1.0"
description = "Inter-University Collaborative Algorithms Project: Game Theory, Polygon Integration, and Voronoi Volume Games"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "ipywidgets>=8.0.0",
]

[tool.setuptools]
packages = ["voronoi_game"]
include-package-data = true

[tool.setuptools.package-dir]
"voronoi_game" = "voronoi-game"

[tool.setuptools.package-data]
voronoi_game = ["voronoi_volume_game.html", "rhill-voronoi-core.min.js"]
